<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Seismic Spotlight</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    @import url('https://fonts.googleapis.com/css?family=Montserrat:700,400&display=swap');
    :root {
      --main-gradient: linear-gradient(135deg, #f9e9dd 0%, #e5d3be 100%);
      --main-color: #b8a97e;
      --main-color-soft: #e5d3be;
      --title-shadow: 0 4px 24px rgba(110,90,60,0.16);
      --text: #544927;
      --hover-bg: rgba(240,220,191,0.97);
      --footer-bg: #f5ead0ee;
      --footer-fg: #75613f;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      font-family: 'Montserrat', Arial, Helvetica, sans-serif;
      background: var(--main-gradient);
      color: var(--text);
      overflow-x: hidden;
      transition: background 1s;
    }
    .main-title {
      font-size: 2.7em;
      font-weight: 700;
      text-align: center;
      color: var(--main-color);
      margin-top: 32px;
      margin-bottom: 56px;
      text-shadow: var(--title-shadow);
      letter-spacing: 0.08em;
      user-select: none;
    }
    .floating {
      position: fixed;
      will-change: transform;
      pointer-events: none;
      z-index: 1200;
      width: 46px;
      height: 46px;
      opacity: 0.92;
      filter: drop-shadow(0px 2px 12px rgba(120,98,51,0.12));
      transition: opacity 1s;
    }
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(255, 242, 223, 0.68);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1600;
      animation: modalfadeIn 1.1s;
    }
    @keyframes modalfadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    .modal {
      background: var(--main-color-soft);
      border-radius: 22px;
      box-shadow: 0 8px 38px 6px rgba(155,132,96,0.13);
      min-width: 320px;
      max-width: 90vw;
      padding: 32px 38px;
      text-align: center;
      opacity: 0;
      transform: translateY(40px) scale(0.98);
      animation: modalfade 1.1s 0.6s forwards;
    }
    @keyframes modalfade {
      to {opacity:1; transform:translateY(0) scale(1);}
    }
    .modal-title {
      font-size: 1.5em;
      color: var(--main-color);
      margin-bottom:18px;
      font-weight: 700;
      letter-spacing: .04em;
    }
    .btn-row {
      display: flex;
      justify-content: center;
      gap: 18px;
      margin-top:22px;
    }
    .modal-btn, .support-btn, .gallery-btn {
      background: var(--main-gradient);
      color: var(--text);
      font-weight: bold;
      border: none;
      border-radius: 12px;
      padding: 13px 35px;
      font-size: 1.1em;
      box-shadow: 0 2px 12px #dfc7a6a8;
      transition: background .18s, color .18s, transform .15s;
      cursor: pointer;
    }
    .modal-btn:hover, .support-btn:hover, .gallery-btn:hover {
      background: linear-gradient(99deg, #bfc19e 0%, #e7dbb7 100%);
      transform: scale(1.04);
    }
    .gallery-carousel-bg {
      position: fixed;
      inset: 0;
      background: rgba(255,250,240,0.98);
      z-index: 4200;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
    }
    .gallery-carousel-bg.visible {
      display: flex;
      animation: fadeIn 1.1s;
    }
    .gallery-carousel-bg {
  position: fixed;
  inset: 0;
  background: rgba(255,250,240,0.98);
  z-index: 4200;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start; /* было center */
  pointer-events: auto;
}

/* Фиксируем header сверху, с кнопкой справа */
.gallery-carousel-header {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  padding: 16px 48px 16px 20px; /* добавлен отступ справа для кнопки */
  background: rgba(255,254,241,0.95);
  text-align: center;
  color: #8d793e;
  font-size: 2em;
  font-weight: 800;
  letter-spacing: 0.06em;
  box-shadow: 0 4px 20px #ccbfa529;
  z-index: 4301;
  user-select: none;
  box-sizing: border-box;
  display: flex;
  justify-content: center;
  align-items: center;
  margin: 0;
  height: 56px;
}
.gallery-carousel-close {
  position: absolute;
  top: 18px;
  right: 26px;
  background: #eadcb1;
  color: #775821;
  border: none;
  font-size: 1em;
  border-radius: 7px;
  padding: 6px 15px;
  cursor: pointer;
  z-index: 10;
  font-weight: 700;
  box-shadow: 0 1px 6px #b39e77a8;
}
.gallery-carousel-row {
  width: 100vw;
  max-width: 1300px;
  margin: 0 auto;        /* по центру страницы */
  display: flex;
  flex-wrap: wrap;      /* разрешаем перенос строк */
  justify-content: center;
  align-items: center;
  gap: 30px 30px;       /* вертикальный и горизонтальный отступ */
  min-height: 720px;    /* увеличьте, чтобы вместить 2 ряда фото (например, 2 раза по 350px) */
  padding-top: 56px;    /* под шапку */
  pointer-events: none;
  overflow: hidden;
  box-sizing: border-box;
}
    .gallery-carousel-img-link {
      display: block;
      pointer-events: all;
      border-radius: 24px;
      box-shadow: 0 8px 32px 4px #cbb78d29;
      overflow: hidden;
      transition: box-shadow .23s;
      background: #e7dab7;
    }
    .gallery-carousel-img-link:hover img,
    .gallery-carousel-img-link:focus img {
      filter: brightness(0.92) blur(1px);
      box-shadow: 0 16px 54px 8px #baa86a73;
      transform: scale(1.04);
      z-index: 4;
    }
    .gallery-carousel-img {
      width: 230px;
      height: 316px;
      object-fit: cover;
      border-radius: 24px;
      box-shadow: 0 6px 28px 2px #cbb78d29;
      cursor: pointer;
      transition: box-shadow .23s, transform .34s, filter .18s, opacity .44s;
      opacity: 0;
      will-change: opacity, transform;
      background: #e1d4b2;
      display: block;
    }
    .gallery-carousel-img.show {
      opacity: 1;
      animation: fadeImgIn .9s cubic-bezier(.68,.02,.7,1.15);
    }
    @keyframes fadeImgIn { from {opacity: 0; transform: scale(0.95) translateY(20px);} to {opacity: 1; transform: scale(1) translateY(0);} }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    .gallery-section {
      display: none;
      padding: 40px 20px 90px 20px;
      max-width: 1550px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      gap: 38px 32px;
      align-items: flex-start;
      position: relative;
      min-height: 800px;
    }
    .gallery-img-container {
      position: relative;
      box-sizing: border-box;
      margin: 0;
      animation: galleryAppear 1.2s cubic-bezier(.6,-0.04,.5,1.16);
      opacity: 0;
      transform: translateY(40px) scale(0.97);
      animation-fill-mode: forwards;
      border-radius: 18px;
      overflow: visible;
      transition: box-shadow .3s;
      z-index: 1;
      will-change: transform;
    }
    @keyframes galleryAppear {
      to { opacity: 1; transform: translateY(0) scale(1);}
    }
    .gallery-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 18px;
      box-shadow: 0 4px 28px 3px #cbb78d29;
      cursor: pointer;
      transition: box-shadow 0.2s, transform 0.14s, filter 0.18s;
      display: block;
      z-index: 1;
      position: relative;
      background: #e6dcc1;
    }
    .gallery-img-link {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 18px;
      overflow: hidden;
      position: relative;
      transition: box-shadow .3s;
    }
    .gallery-img-container:hover,
    .gallery-img-container:focus-within {
      box-shadow: 0 12px 54px 10px #c0b18b46;
      z-index: 10;
    }
    .gallery-img-link:hover .gallery-img,
    .gallery-img-link:focus .gallery-img {
      filter: blur(1.5px) brightness(0.95);
      box-shadow: 0 10px 35px 8px #c6b08041;
      transform: scale(1.04);
      z-index: 9;
    }
    .gallery-tooltip {display: none !important;}
    .gallery-img-container { transition: box-shadow 0.3s, z-index 0.2s; }
    .gallery-img-container.masonry-big { width: 270px; height: 360px; }
    .gallery-img-container.masonry-sm { width: 190px; height: 260px; }
    .site-footer {
      width: 100vw;
      max-width: 100%;
      padding: 36px 0 28px 0;
      background: var(--footer-bg);
      color: var(--footer-fg);
      text-align: center;
      font-size: 1.17em;
      font-weight: 600;
      letter-spacing: 0.02em;
      box-shadow: 0 0 40px 0 #cabfa36d;
      margin-top: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity .6s cubic-bezier(.44,.52,.22,.99);
      position: relative;
      z-index: 44;
      border-top-left-radius: 34px;
      border-top-right-radius: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 70px;
      margin-bottom: 0;
      user-select: text;
    }
    .site-footer.visible {
      opacity: 1;
      pointer-events: auto;
      margin-top: 22px;
    }
    .site-footer a {
      color: #886211;
      text-decoration: underline;
      font-weight: 700;
      font-size: 1.1em;
      margin-left: 4px;
    }
    @media (max-width: 1100px) {
      .gallery-carousel-img, .gallery-carousel-img-link { width:150px; height:196px;}
      .gallery-carousel-row { gap:22px; min-height:200px;}
    }
    @media (max-width: 650px) {
      .main-title { font-size: 1.2em;}
      .gallery-carousel-img,.gallery-carousel-img-link { width:86px; height:110px; border-radius:12px;}
      .gallery-carousel-row { gap:7px; min-height:120px;}
      .gallery-carousel-header {font-size:1.12em;}
    }
    @media (max-width: 700px) {
      .site-footer {font-size: 0.97em; border-radius: 20px 20px 0 0; padding: 25px 2vw 22px 2vw;}
    }
    @media (max-width: 460px) {
      .site-footer {padding: 13px 1vw 9px 1vw; font-size: 0.92em;}
    }
    @media (max-width: 1400px) {
      .gallery-section { max-width:99vw; gap:28px 12px;}
      .gallery-img-container.masonry-big {width:220px; height:300px;}
      .gallery-img-container.masonry-sm {width:140px; height:190px;}
    }
    @media (max-width: 900px) {
      .gallery-section {max-width:99vw; gap:14px 7px;}
      .gallery-img-container.masonry-big {width:48vw; height:28vw;}
      .gallery-img-container.masonry-sm {width:38vw; height:21vw;}
    }
    @media (max-width: 600px) {
      .main-title { font-size: 2em; }
      .gallery-section{flex-direction:column;gap:11px;}
      .gallery-img-container.masonry-big, .gallery-img-container.masonry-sm {
        width:94vw !important; height: auto !important; min-height: 180px;
      }

    // Фотки-кружки для background
    const floatImgs = ['1.png', '2.png', '3.png', '4.png'];
    const FLOAT_COUNT = 40;
    const floatingEls = [];
    function makeFloatingImgs() {
      const box = document.getElementById('floating-container');
      box.innerHTML = '';
      for (let i = 0; i < FLOAT_COUNT; ++i) {
        let img = document.createElement('img');
        img.src = floatImgs[Math.floor(Math.random() * floatImgs.length)];
        img.className = 'floating';
        let x = Math.random() * window.innerWidth,
            y = Math.random() * window.innerHeight * 0.8,
            angle = Math.random() * Math.PI * 2;
        let speed = 0.18 + Math.random() * 0.21;
        floatingEls.push({ el: img, x, y, angle, speed, dx: Math.cos(angle) * speed, dy: Math.sin(angle) * speed });
        box.appendChild(img);
      }
    }
    function moveFloating() {
      for (const obj of floatingEls) {
        obj.x += obj.dx;
        obj.y += obj.dy;
        if (obj.x < 0 || obj.x > window.innerWidth - 50) obj.dx *= -1;
        if (obj.y < 0 || obj.y > window.innerHeight - 50) obj.dy *= -1;
        obj.el.style.transform = `translate(${obj.x}px,${obj.y}px)`;
      }
      if (window.__showFloating) requestAnimationFrame(moveFloating);
    }
    window.__showFloating = true;
    makeFloatingImgs();
    moveFloating();

    function showFooter() {
      let footer = document.getElementById('site-footer');
      if (!footer) {
        footer = document.createElement('footer');
        footer.id = 'site-footer';
        footer.className = 'site-footer';
        footer.innerHTML = `Yo, if you want your work to be added to this site then just DM me - <a href="https://x.com/realsirandrew" target="_blank">realsir</a>.`;
        document.getElementById('footer-placeholder').appendChild(footer);
        setTimeout(() => {footer.classList.add('visible')}, 100);
      } else {
        footer.classList.add('visible');
      }
    }
    function hideIntro() {
      document.getElementById('welcomeModal').style.display = 'none';
      for (let { el } of floatingEls) el.style.opacity = 0;
      window.__showFloating = false;
      setTimeout(() => {
        document.getElementById('floating-container').remove();
        startGallery();
      }, 900);
    }
  function showWelcome() {
  document.getElementById('welcomeModal').style.display = 'flex';

  window.scrollTo({ top: 0, behavior: 'smooth' });
// === вот это добавляем ===
  if (!document.getElementById('floating-container')) {
    const floatingDiv = document.createElement('div');
    floatingDiv.id = 'floating-container';
    document.body.insertBefore(floatingDiv, document.body.firstChild.nextSibling);
    // Сбросить глобальные переменные
    while (floatingEls.length > 0) floatingEls.pop();
    window.__showFloating = true;
    makeFloatingImgs();
    moveFloating();
  } else {
    // Если не удалено — сделать их снова видимыми
    for (let { el } of floatingEls) el.style.opacity = 0.92;
    window.__showFloating = true;
    moveFloating();
  }
}

    let carouselTimer = null, carouselIdx = 0;
   function startGalleryCarousel() {
  carouselIdx = 0;
  updateCarousel();
  carouselTimer = setInterval(() => {
    carouselIdx = (carouselIdx + 10) % galleryData.length;  // сдвигать на 10 фото
    updateCarousel();
  }, 3000);
}
    function stopGalleryCarousel() {
      if(carouselTimer) clearInterval(carouselTimer);
      carouselTimer = null;
    }
    function updateCarousel() {
  const row = document.getElementById('carouselRow');
  row.innerHTML = '';
  for (let i = 0; i < 10; ++i) {  // показываем 10 фото (2 ряда по 5)
    let idx = (carouselIdx + i) % galleryData.length;
    const {img, link} = galleryData[idx];
    const linkEl = document.createElement('a');
    linkEl.href = link;
    linkEl.target = '_blank';
    linkEl.className = 'gallery-carousel-img-link';
    const imgEl = document.createElement('img');
    imgEl.src = img;
    imgEl.alt = `Seismic image ${idx+1}`;
    imgEl.className = 'gallery-carousel-img';
    linkEl.appendChild(imgEl);
    row.appendChild(linkEl);
    setTimeout(() => { imgEl.classList.add('show'); }, 60 + i*60);
  }
}

    function getTweetIdFromUrl(url) {
      const match = url.match(/status\/(\d+)/);
      return match ? match[1] : null;
    }
    function supportTweet() {
      const tweet = galleryData[Math.floor(Math.random() * galleryData.length)];
      const tweetId = getTweetIdFromUrl(tweet.link);
      if (!tweetId) {
        alert('Tweet id not found!');
        return;
      }
      const comment = supportComments[Math.floor(Math.random() * supportComments.length)];
      const url = `https://twitter.com/intent/tweet?in_reply_to=${tweetId}&text=${encodeURIComponent(comment)}`;
      window.open(url, '_blank');
    }
    function startGallery() {
  document.getElementById('welcomeModal').style.display = 'none';
  document.getElementById('main-gallery-wrapper').style.display = 'block';
  const gallery = document.getElementById('main-gallery');
  gallery.innerHTML = '';
  gallery.style.display = 'flex';
      const colCount = window.innerWidth < 900 ? 2 : (window.innerWidth < 1400 ? 3 : 5);
      const columns = Array.from({ length: colCount }, () => []);
      for (let row = 0; row < Math.ceil(galleryData.length / colCount); row++) {
        for (let col = 0; col < colCount; col++) {
          let idx = row * colCount + col;
          if (idx >= galleryData.length) break;
          const item = galleryData[idx];
          let isBig = (idx % 7 === 0) || ((idx + 3) % 7 === 0);
          let extraOffset = (Math.random() > 0.5) ? 18 * ((idx % 3) - 1) : 0;
          columns[col].push({
            html: `
              <div class="gallery-img-container ${isBig ? 'masonry-big' : 'masonry-sm'}"
                   style="animation-delay:${0.10 * idx + 0.23}s; transform:translateY(${extraOffset}px);">
                <a href="${item.link}" class="gallery-img-link" target="_blank" rel="noopener noreferrer">
                  <img src="${item.img}" alt="Seismic image ${idx+1}" class="gallery-img" tabindex="0" />
                </a>
              </div>`,
            height: isBig ? 360 : 210
          });
        }
      }
      columns.forEach(col => {
        const colDiv = document.createElement('div');
        colDiv.style.display = 'flex';
        colDiv.style.flexDirection = 'column';
        colDiv.style.gap = '36px';
        colDiv.style.flex = '1 1 0%';
        colDiv.innerHTML = col.map(obj => obj.html).join('');
        gallery.appendChild(colDiv);
      });
      showFooter();
      setTimeout(() => { gallery.scrollIntoView({ behavior: 'smooth' }); }, 220);
    }
    window.addEventListener('resize', () => {
      if (window.__showFloating) {
        floatingEls.forEach(f => {
          f.x = Math.min(f.x, window.innerWidth - 50);
          f.y = Math.min(f.y, window.innerHeight - 50);
        });
      }
    });
    document.getElementById('welcomeModal')
      .addEventListener('wheel', e => e.preventDefault(), { passive: false });
